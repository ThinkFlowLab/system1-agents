openapi: 3.1.0
info:
  title: Laya decisions (System 1) — /v1/systemone, as implemented today
  version: 0.1.0
  summary: Typed decisions from a Laya checkpoint over HTTP.
  description: |
    The interface a client such as system1-agents uses to get decisions from Laya served by
    system1-omni: the Laya worker (`python -m frontend.laya_mps`, laya-serve 0.3.20 underneath), either
    directly or behind the Rust frontend (`omni-jev`), which forwards requests and responses unchanged.

    This document describes the behaviour of laya-serve 0.3.20, the worker and the frontend as they
    are, captured from a running worker. Differences from common API practice are listed under
    `x-known-gaps` rather than described as if they existed.

    **Idempotency.** A decision has no side effects and the same request returns the same answers
    (Laya is deterministic for a given checkpoint, device and precision). Clients may retry any
    request whose outcome they did not receive.

    **Retries.** Neither the frontend nor the worker retries. The client owns retries and their
    deadline.

    **Concurrency.** The worker runs one forward pass at a time; concurrent requests queue, so latency
    grows with concurrency while throughput stays flat.
  license:
    name: Apache-2.0
servers:
  - url: http://127.0.0.1:8000
    description: Laya worker directly (LAYA_HOST / LAYA_PORT)
  - url: http://127.0.0.1:8080
    description: Rust frontend in front of the worker (OMNI_JEV_BIND)
security:
  - {}
  - bearerAuth: []
tags:
  - name: decisions
  - name: health
paths:
  /v1/systemone:
    post:
      tags: [decisions]
      operationId: decide
      summary: Answer typed questions about one state
      description: |
        All questions are answered in one forward pass. Question ids are chosen by the client and
        echoed as the keys of `answers`.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        description: At most 2 MiB (2,097,152 bytes); larger bodies get 413 before they are parsed.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
            examples:
              combined:
                summary: One question of each type
                value:
                  model: english
                  state: I was charged twice for my order. Please refund the duplicate today.
                  questions:
                    department:
                      type: choice
                      instructions: Which team should handle this?
                      criteria: { billing: Charges and refunds, technical: Software problems }
                    urgency:
                      type: score
                      instructions: How urgent is the request?
                      criteria: [Not urgent, Needs attention soon, Needs attention immediately]
                    refund:
                      type: noul
                      instructions: Does the customer ask for a refund?
      responses:
        '200':
          description: Answers, one per question id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
              examples:
                combined:
                  summary: Response to the combined request (captured, M1 Pro, MPS, fp16 weights)
                  value:
                    model: laya-rl-agent
                    answers:
                      department:
                        type: choice
                        choice: billing
                        probabilities: { billing: 0.952, technical: 0.048 }
                        confidence: 0.7222
                        answer_confidence: 0.952
                        action: { act_probability: 1.0 }
                      urgency:
                        type: score
                        score: 1.7841
                        legend: { '0': Not urgent, '1': Needs attention soon, '2': Needs attention immediately }
                        probabilities: { '0': 0.0241, '1': 0.1677, '2': 0.8082 }
                        confidence: 0.4891
                        answer_confidence: 0.8082
                        action: { act_probability: 1.0 }
                      refund:
                        type: noul
                        noul: 0.9161
                        confidence: 0.9161
                        answer_confidence: 0.9161
                        action: { act_probability: 1.0 }
                    usage: { input_tokens: 137, output_tokens: 0 }
                    routing:
                      model: english
                      repo: convaiinnovations/laya
                      reason: explicit model='english'
                      detection: null
                      workflow: null
        '400':
          description: The body is not valid JSON, is not an object, lacks `questions`, or `questions` is not an object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                malformed: { value: { detail: request body must be valid JSON } }
                noQuestions: { value: { detail: "request body must be an object with a 'questions' field" } }
        '401':
          description: The worker was started with `LAYA_API_KEY` and the bearer token is missing or wrong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { detail: invalid or missing bearer token }
        '413':
          description: Body over 2 MiB, more than 64 questions, or a state over 50,000 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { detail: too many questions (65 > 64) }
        '422':
          description: |
            A question is invalid: unknown type, no `instructions`, wrongly shaped or empty `criteria`,
            `labels` on a non-noul question, or options longer than the checkpoint's option window.
            `detail` names the question id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { detail: "question 'q': unknown type 'bogus'; use one of ['choice', 'noul', 'score']" }
        '500':
          description: The forward pass failed. `detail` carries no internal information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { detail: inference failed }
        '502':
          description: Frontend only. The worker could not be reached.
          content:
            text/plain:
              schema: { type: string }
              example: "backend unavailable\n"
        '504':
          description: Frontend only. The worker did not answer within the frontend's 60 s timeout.
          content:
            text/plain:
              schema: { type: string }
              example: "backend timed out\n"
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Readiness and what the worker is running
      description: |
        The worker listens only after it has loaded and warmed up every model, so any response means
        ready; a refused connection means not ready yet. Through the frontend, the worker's response is
        forwarded (502 or 504 if the worker is unreachable). No authentication.

        Plain laya-serve (without the worker) answers `{status, loaded, device}` as soon as it binds,
        before any warmup, and `device` is the configured `LAYA_DEVICE`, not the device in use.
      security:
        - {}
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                status: ok
                ready: true
                loaded: [english]
                device: mps
                requested_device: mps
                device_mismatch: false
                weights_dtype: torch.float16
                autocast_dtype: torch.float16
                mps_amp_min_rows: 5
                checkpoint: convaiinnovations/laya
                revision: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851
                warmup_ms: 34426.6
                models:
                  english:
                    device: mps
                    requested_device: mps
                    device_mismatch: false
                    weights_dtype: torch.float16
                    autocast_dtype: torch.float16
                    mps_amp_min_rows: 5
                    checkpoint: convaiinnovations/laya
                    revision: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851
                    warmup_ms: 34426.6
                compile: { enabled: true, graphs_at_ready: 3, graphs_now: 3, recompiled_after_ready: false }
        '502':
          description: Frontend only. The worker could not be reached.
          content:
            text/plain:
              schema: { type: string }
        '504':
          description: Frontend only. The worker did not answer in time.
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when the worker is started with `LAYA_API_KEY`. The frontend forwards the header.
  schemas:
    DecisionRequest:
      type: object
      required: [questions]
      properties:
        model:
          type: string
          description: |
            Checkpoint: `english`, `multilingual`, `typed-decisions`, an alias (`en`, `laya`, `default`),
            or a published Hugging Face id. Omitted or unrecognised (e.g. a Jev model id), the worker
            picks a checkpoint from the state's language. Only loaded checkpoints are served warm.
          examples: [english]
        state:
          description: What the questions are about. At most 50,000 characters (as text or as serialised JSON).
          oneOf:
            - type: string
            - type: object
            - type: array
        questions:
          type: object
          description: Question id → question. At least 1 and at most 64.
          minProperties: 1
          maxProperties: 64
          additionalProperties: { $ref: '#/components/schemas/Question' }
    Question:
      oneOf:
        - $ref: '#/components/schemas/ChoiceQuestion'
        - $ref: '#/components/schemas/ScoreQuestion'
        - $ref: '#/components/schemas/NoulQuestion'
      discriminator:
        propertyName: type
        mapping:
          choice: '#/components/schemas/ChoiceQuestion'
          score: '#/components/schemas/ScoreQuestion'
          noul: '#/components/schemas/NoulQuestion'
    Instructions:
      description: What to decide. An object is serialised to JSON before the model reads it.
      oneOf:
        - type: string
        - type: object
    ChoiceQuestion:
      type: object
      required: [type, instructions, criteria]
      properties:
        type: { const: choice }
        instructions: { $ref: '#/components/schemas/Instructions' }
        criteria:
          description: Options, as label → description or as a list of labels. At least one.
          oneOf:
            - type: object
              minProperties: 1
              additionalProperties: {}
            - type: array
              minItems: 1
              items: { type: string }
    ScoreQuestion:
      type: object
      required: [type, instructions, criteria]
      properties:
        type: { const: score }
        instructions: { $ref: '#/components/schemas/Instructions' }
        criteria:
          type: array
          description: Level descriptions, level 0 first. At least one.
          minItems: 1
          items: {}
    NoulQuestion:
      type: object
      required: [type, instructions]
      properties:
        type: { const: noul }
        instructions:
          $ref: '#/components/schemas/Instructions'
          description: A statement or yes/no question; a plain string is what Laya was trained on.
        criteria:
          type: object
          description: Optional texts for the two outcomes, keyed only `true` and/or `false`.
          propertyNames: { enum: ['true', 'false', 'True', 'False', 'TRUE', 'FALSE'] }
        labels:
          type: object
          description: Optional wording of the two outcomes shown to the model; exactly `false` and `true`, distinct and non-empty.
          required: ['false', 'true']
          additionalProperties: false
          properties:
            'false': { type: string, minLength: 1 }
            'true': { type: string, minLength: 1 }
    DecisionResponse:
      type: object
      required: [model, answers, usage]
      properties:
        model:
          type: string
          description: Always `laya-rl-agent`, whichever checkpoint answered. Use `routing.repo` and `/health` for identity.
        answers:
          type: object
          description: Question id → answer, one per question in the request.
          additionalProperties: { $ref: '#/components/schemas/Answer' }
        usage: { $ref: '#/components/schemas/Usage' }
        routing: { $ref: '#/components/schemas/Routing' }
    Answer:
      oneOf:
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/ScoreAnswer'
        - $ref: '#/components/schemas/NoulAnswer'
      discriminator:
        propertyName: type
        mapping:
          choice: '#/components/schemas/ChoiceAnswer'
          score: '#/components/schemas/ScoreAnswer'
          noul: '#/components/schemas/NoulAnswer'
    Probability:
      type: number
      minimum: 0
      maximum: 1
      description: Rounded to 4 decimals.
    AnswerCommon:
      type: object
      required: [type, confidence, answer_confidence, action]
      properties:
        confidence:
          $ref: '#/components/schemas/Probability'
          description: Calibrated confidence in the answer.
        answer_confidence: { $ref: '#/components/schemas/Probability' }
        action:
          type: object
          required: [act_probability]
          properties:
            act_probability: { $ref: '#/components/schemas/Probability' }
    ChoiceAnswer:
      allOf:
        - $ref: '#/components/schemas/AnswerCommon'
        - type: object
          required: [type, choice, probabilities]
          properties:
            type: { const: choice }
            choice: { type: string, description: The chosen label. }
            probabilities:
              type: object
              description: Label → probability, summing to 1 (within rounding).
              additionalProperties: { $ref: '#/components/schemas/Probability' }
    ScoreAnswer:
      allOf:
        - $ref: '#/components/schemas/AnswerCommon'
        - type: object
          required: [type, score, legend, probabilities]
          properties:
            type: { const: score }
            score: { type: number, minimum: 0, description: Expected level index. }
            legend:
              type: object
              description: Level index (as a string) → level description.
              additionalProperties: {}
            probabilities:
              type: object
              description: Level index (as a string) → probability, summing to 1 (within rounding).
              additionalProperties: { $ref: '#/components/schemas/Probability' }
    NoulAnswer:
      allOf:
        - $ref: '#/components/schemas/AnswerCommon'
        - type: object
          required: [type, noul]
          properties:
            type: { const: noul }
            noul:
              $ref: '#/components/schemas/Probability'
              description: Probability that the statement is true.
    Usage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens: { type: integer, minimum: 0, description: Tokens read across all questions. }
        output_tokens: { type: integer, const: 0, description: Laya generates no text. }
    Routing:
      type: object
      description: Which checkpoint answered and why.
      properties:
        model: { type: string, examples: [english] }
        repo: { type: string, examples: [convaiinnovations/laya] }
        reason: { type: string }
        detection:
          type: [object, 'null']
          description: Language detection details when the checkpoint was chosen automatically.
        workflow: { type: [object, 'null'] }
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: Human-readable; not meant for parsing. }
    ModelHealth:
      type: object
      required: [device, requested_device, device_mismatch]
      properties:
        device: { type: string, description: 'Where the model actually runs, e.g. mps, cpu, cuda:0.' }
        requested_device: { type: string, description: LAYA_DEVICE, or `auto`. }
        device_mismatch: { type: boolean }
        weights_dtype: { type: [string, 'null'] }
        autocast_dtype: { type: string }
        mps_amp_min_rows: { type: [integer, 'null'] }
        checkpoint: { type: [string, 'null'] }
        revision:
          type: [string, 'null']
          description: Commit the weights were downloaded from; null for a local checkpoint.
        warmup_ms: { type: number }
    Health:
      allOf:
        - $ref: '#/components/schemas/ModelHealth'
        - type: object
          required: [status, ready, loaded, models, compile]
          description: Top-level model fields describe the `--model` the worker serves; `models` has every loaded model.
          properties:
            status: { const: ok }
            ready: { const: true }
            loaded: { type: array, items: { type: string } }
            models:
              type: object
              additionalProperties: { $ref: '#/components/schemas/ModelHealth' }
            compile:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean, description: "Started with --compile." }
                graphs_at_ready: { type: integer }
                graphs_now: { type: integer }
                recompiled_after_ready: { type: boolean }
x-known-gaps:
  - Errors use FastAPI's `{"detail": string}`, not RFC 9457 problem details; the frontend's 502/504 are text/plain. Clients should branch on the status code only.
  - No request id or trace header is accepted or returned.
  - Overload has no 429/503 with Retry-After; requests queue behind the single inference thread.
  - The response `model` field does not identify the checkpoint (always `laya-rl-agent`).
  - The response carries no server-side inference time; only the client round trip can be measured.
  - '`score` answers are returned by the server; system1-agents does not ask score questions yet.'
